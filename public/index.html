<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast &amp; Speech Writer</title>
<style>
  :root { --bg: #faf6ef; --ink: #2b2118; --muted: #7b6b5a; --line: #eadfcd; --card: #fff; --gold: #b8860b; --wine: #862e3a; --green: #2b8a3e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 26px 16px 56px; }
  h1 { font: 700 36px/1.1 Georgia, serif; margin: 0; } h1 span { color: var(--wine); font-style: italic; } .sub { color: var(--muted); margin: 4px 0 8px; }
  #status { font-size: 13px; color: var(--muted); margin: 0 0 12px; } #status.ok { color: var(--green); } #status.err { color: #c92a2a; }
  .cols { display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; align-items: start; } @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; } .wide { grid-column: 1 / -1; }
  label.small { font-size: 13px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); } textarea { resize: vertical; } #memories { min-height: 130px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #f0c36d; outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--wine); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: 14px; } button.busy { opacity: .55; cursor: progress; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; } .note { color: var(--muted); font-size: 14px; min-height: 20px; margin: 8px 0 0; }
  #speech { min-height: 380px; font: 17px/1.75 Georgia, serif; background: #fffdf8; }
  .time { font-size: 14px; font-weight: 700; } .time.good { color: var(--green); } .time.long { color: #d9480f; }
  #prompter { position: fixed; inset: 0; background: #111; color: #fff; z-index: 10; display: flex; flex-direction: column; } #prompter.hidden { display: none; }
  #pBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #1e1e1e; } #pBar label { color: #bbb; font-size: 14px; } #pBar input[type=range] { width: 160px; accent-color: var(--gold); padding: 0; border: 0; }
  #pClock { font: 700 22px ui-monospace, Consolas, monospace; color: #ffd43b; margin-left: auto; } #pBar button.ghost { background: transparent; color: #fff; border-color: #444; }
  #pView { flex: 1; overflow: hidden; position: relative; } #pText { position: absolute; left: 0; right: 0; padding: 45vh 8vw; font: 600 clamp(28px, 4.5vw, 48px)/1.55 Georgia, serif; white-space: pre-wrap; }
  #pView::after { content: ""; position: absolute; left: 0; right: 0; top: 40%; height: 3px; background: rgba(255,212,59,.5); } .fine { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #pText { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Toast &amp; Speech <span>Writer</span></h1>
  <p class="sub">Share a few real memories. Get a speech that sounds like you. Then practice with the teleprompter.</p>
  <p id="status">Checking the AI speech writer...</p>
  <div class="cols">
    <section class="panel">
      <div class="grid">
        <div><label class="small" for="occasion">Occasion</label><select id="occasion"><option>Wedding toast</option><option>Birthday toast</option><option>Graduation speech</option><option>Retirement speech</option><option>Farewell speech</option><option>Anniversary toast</option><option>Thank-you speech for an award</option></select></div>
        <div><label class="small" for="tone">Tone</label><select id="tone"><option value="mix">Funny + heartfelt</option><option value="heartfelt">Heartfelt</option><option value="funny">Funny (kind)</option></select></div>
        <div><label class="small" for="who">It's for...</label><input id="who" placeholder="Sam and Priya" maxlength="60" autocomplete="off"></div>
        <div><label class="small" for="relation">I am their...</label><input id="relation" placeholder="best friend" maxlength="60" autocomplete="off"></div>
        <div><label class="small" for="speaker">My name (optional)</label><input id="speaker" maxlength="60" autocomplete="off"></div>
        <div><label class="small" for="minutes">Length</label><select id="minutes"><option value="1">About 1 minute</option><option value="2" selected>About 2 minutes</option><option value="3">About 3 minutes</option><option value="5">About 5 minutes</option></select></div>
        <div class="wide"><label class="small" for="memories">Your memories and details (the more real, the better)</label><textarea id="memories" placeholder="We met in 7th grade when Sam tripped over my backpack...&#10;Priya always brings snacks for everyone...&#10;They love hiking together."></textarea></div>
      </div>
      <div class="row"><button id="go">Write my speech</button><button class="ghost" id="sample">Try a sample</button></div>
      <p class="note" id="note"></p>
    </section>
    <section class="panel">
      <textarea id="speech" placeholder="Your speech will appear here. Edit it until it sounds like you." aria-label="Your speech"></textarea>
      <div class="row"><span class="time" id="time">0 words</span><span style="flex:1"></span><button class="ghost" id="copy">Copy</button><button id="practice">▶ Practice with teleprompter</button></div>
      <p class="fine">Timing assumes a calm speaking speed of about 130 words per minute.</p>
    </section>
  </div>
</main>

<div id="prompter" class="hidden" role="dialog" aria-label="Teleprompter">
  <div id="pBar"><button id="pPlay">▶ Start</button><button class="ghost" id="pRestart">↺ Restart</button><label for="pSpeed">Speed</label><input id="pSpeed" type="range" min="80" max="200" value="130"><span id="pWpm" style="color:#bbb;font-size:14px">130 wpm</span><span id="pClock">0:00</span><button class="ghost" id="pClose">✕ Close (Esc)</button></div>
  <div id="pView"><div id="pText"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let busy = false, ai = { ready: false, message: "Loading...", percent: null, error: null };
try { const s = JSON.parse(localStorage.getItem("speechDraft") || "null"); if (s) ["who", "relation", "speaker", "memories", "speech"].forEach((k) => ($(k).value = s[k] || "")); } catch {}
const persist = () => { try { localStorage.setItem("speechDraft", JSON.stringify(Object.fromEntries(["who", "relation", "speaker", "memories", "speech"].map((k) => [k, $(k).value])))); } catch {} };
["who", "relation", "speaker", "memories"].forEach((id) => $(id).addEventListener("input", persist));
$("sample").addEventListener("click", () => { $("occasion").value = "Wedding toast"; $("who").value = "Sam and Priya"; $("relation").value = "best friend"; $("speaker").value = "Leo";
  $("memories").value = "Sam and I met in 7th grade when he tripped over my backpack and blamed the backpack.\nPriya is the calmest person I know, and she always brings snacks for everyone.\nThe first time Sam talked about Priya, he smiled for ten minutes straight.\nThey love hiking together, even though Sam always gets lost."; persist(); });

function timing() { const n = ($("speech").value.match(/\S+/g) || []).length, secs = Math.round((n / 130) * 60), target = +$("minutes").value * 60;
  $("time").textContent = n + " words \u00b7 about " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") + " to say"; $("time").className = "time " + (n && Math.abs(secs - target) <= 30 ? "good" : secs > target + 30 ? "long" : ""); }
$("speech").addEventListener("input", () => { timing(); persist(); }); $("minutes").addEventListener("change", timing);

// Simple speech from your memories, for when the AI isn't ready yet
function template() {
  const who = $("who").value.trim() || "our guest of honor", rel = $("relation").value.trim(), me = $("speaker").value.trim(), toast = /toast/i.test($("occasion").value);
  const mems = $("memories").value.split("\n").map((m) => m.trim()).filter(Boolean);
  return "Good evening, everyone. " + (me ? "My name is " + me + ", and " : "") + (rel ? "I'm " + who.split(" and ")[0] + "'s " + rel + ". " : "") + "I'm so happy to be here to celebrate " + who + ".\n\n" +
    (mems.length ? mems.slice(0, 3).join("\n\n") + "\n\n" : "") + "Those moments say so much about who " + (/ and /.test(who) ? "they are" : "you are") + ": kind, funny, and someone we're all lucky to know.\n\n" +
    (toast ? "So please raise your glasses. To " + who + "!" : "Congratulations, " + who + ". Thank you.");
}
async function write() {
  if (busy) return; if (!$("who").value.trim()) { $("note").textContent = "Say who the speech is for."; return $("who").focus(); }
  if ($("memories").value.trim().length < 10) { $("note").textContent = "Add at least one real memory or detail (or try the sample)."; return $("memories").focus(); }
  if ($("speech").value.trim().length > 50 && !confirm("Replace your current speech with a new draft?")) return;
  if (!ai.ready) { $("speech").value = template(); timing(); persist(); $("note").textContent = (ai.error ? "The AI isn't available" : "The AI is still loading" + (ai.percent != null ? " (" + ai.percent + "%)" : "")) + ", so this is a simple speech built from your memories."; return; }
  busy = true; $("go").classList.add("busy"); $("note").textContent = "Writing your speech..."; $("speech").value = "";
  try { const res = await fetch("/api/speech", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ occasion: $("occasion").value, who: $("who").value, relation: $("relation").value, speaker: $("speaker").value, memories: $("memories").value, tone: $("tone").value, minutes: $("minutes").value }) });
    if (!res.ok) throw new Error(await res.text()); const reader = res.body.getReader(), dec = new TextDecoder(); let out = "";
    while (true) { const { value, done } = await reader.read(); if (done) break; out += dec.decode(value, { stream: true }); $("speech").value = out.trimStart(); timing(); }
    if (!out.trim()) throw new Error("the AI didn't write anything"); $("note").textContent = "Read it out loud and change anything that doesn't sound like you."; }
  catch (err) { $("speech").value = template(); $("note").textContent = "The AI had a problem (" + err.message + "), so this is a simple speech."; }
  timing(); persist(); busy = false; $("go").classList.remove("busy");
}
$("go").addEventListener("click", write);
$("copy").addEventListener("click", async () => { if (!$("speech").value.trim()) return; try { await navigator.clipboard.writeText($("speech").value); $("copy").textContent = "Copied!"; } catch { $("copy").textContent = "Press Ctrl+C"; } setTimeout(() => ($("copy").textContent = "Copy"), 1200); });

// ---------- Teleprompter: scrolls at your chosen words-per-minute and times you ----------
let pos = 0, playing = false, last = 0, elapsed = 0, raf = 0;
function pxPerSec() { const words = ($("pText").textContent.match(/\S+/g) || []).length || 1, height = $("pText").scrollHeight - window.innerHeight * 0.9; return (height / words) * (+$("pSpeed").value / 60); }
function frame(t) { if (!playing) return; const dt = (t - last) / 1000; last = t; elapsed += dt; pos += pxPerSec() * dt; $("pText").style.transform = "translateY(" + -pos + "px)";
  $("pClock").textContent = Math.floor(elapsed / 60) + ":" + String(Math.floor(elapsed % 60)).padStart(2, "0"); if (pos >= $("pText").scrollHeight - window.innerHeight * 0.5) { playing = false; $("pPlay").textContent = "\u2713 Done"; return; } raf = requestAnimationFrame(frame); }
function play() { if ($("pPlay").textContent.includes("Done")) restart(); playing = !playing; $("pPlay").textContent = playing ? "\u23f8 Pause" : "\u25b6 Start"; if (playing) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function restart() { playing = false; cancelAnimationFrame(raf); pos = 0; elapsed = 0; $("pText").style.transform = "translateY(0)"; $("pClock").textContent = "0:00"; $("pPlay").textContent = "\u25b6 Start"; }
function openP() { if (!$("speech").value.trim()) { $("note").textContent = "Write or paste a speech first."; return; } $("pText").textContent = $("speech").value; $("prompter").classList.remove("hidden"); restart(); $("pPlay").focus(); }
function closeP() { playing = false; cancelAnimationFrame(raf); $("prompter").classList.add("hidden"); $("practice").focus(); if (elapsed > 5) $("note").textContent = "Practice run: " + $("pClock").textContent + ". Nice work!"; }
$("practice").addEventListener("click", openP); $("pPlay").addEventListener("click", play); $("pRestart").addEventListener("click", restart); $("pClose").addEventListener("click", closeP);
$("pSpeed").addEventListener("input", () => ($("pWpm").textContent = $("pSpeed").value + " wpm"));
document.addEventListener("keydown", (e) => { if ($("prompter").classList.contains("hidden")) return; if (e.key === "Escape") closeP(); else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); play(); } });

async function checkStatus() {
  try { ai = await (await fetch("/api/status")).json();
    if (ai.error) return setStatus("AI error: " + ai.error + ". Simple speeches and the teleprompter still work.", "err");
    if (ai.ready) return setStatus("AI speech writer ready. It runs on your device.", "ok");
    setStatus(ai.message + (ai.percent != null ? " " + ai.percent + "%" : "") + " Simple speeches and the teleprompter work meanwhile.");
  } catch { ai = { ready: false, error: "the server can't be reached" }; setStatus("Can't reach the server. Open http://localhost:3077 and make sure npm start is running.", "err"); return; }
  setTimeout(checkStatus, 1500);
}
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }
timing(); checkStatus();
</script>
</body>
</html>
